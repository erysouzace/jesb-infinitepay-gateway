name: PHP Syntax and Release Integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP files
        run: find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Check forbidden secrets
        run: |
          if grep -RniE 'BEGIN (RSA|OPENSSH|PRIVATE) KEY|sk_live_[[:alnum:]]+' --include='*.php' --include='*.txt' .; then exit 1; fi
      - name: Verify release metadata
        run: php tests/check-metadata.php
      - name: Run mocked payment regression tests
        run: php tests/payment-flow.php
      - name: Check Plugin Check regressions
        run: php tests/plugin-check-regressions.php
      - name: Validate WordPress readme and license text
        run: |
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
